# Configuración de preproducción (ilustrativa, sin secretos). Usar con APP_ENV=preprod.
# Mismo artefacto que se valida en dev; cambian rutas y servicios externos, no el modelo.
# Las credenciales (si existieran) se leen de variables de entorno, nunca de este fichero.
entorno: preprod
semilla: 42

datos:
  ruta: data/churn.csv
  target: abandona
  test_size: 0.2      # fracción reservada para test final (no se usa para elegir hiperparámetros)
  val_size: 0.2       # fracción de lo restante para validación

modelo:
  tipo: regresion_logistica        # regresion_logistica | random_forest (ver models.py)
  parametros:
    C: 1.0
    max_iter: 1000
  umbral: 0.5

busqueda:                           # sesión 2: espacio pequeño y acotado
  param_grid:
    clasificador__C: [0.01, 0.1, 1.0, 10.0]
    clasificador__class_weight: [null, balanced]
  cv: 5
  scoring: roc_auc

artefactos:
  dir: artifacts/preprod
  modelo: artifacts/preprod/model.joblib
  metadatos: artifacts/preprod/metadata.json

mlflow:
  tracking_uri: sqlite:///mlflow.db   # en un entorno real: servidor compartido vía MLFLOW_TRACKING_URI
  experimento: churn-abandono
  modelo_registrado: churn-abandono

api:
  host: 127.0.0.1
  port: 8000

monitorizacion:
  referencia: data/churn_referencia.csv
  actual: data/churn_actual.csv
  informe: reports/preprod/drift_report.html
